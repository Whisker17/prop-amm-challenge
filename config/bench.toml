# Seed segments and grid mode's axes for tools/bench (docs/DESIGN.md §2.2, §2.3). Ours,
# protocol-level — a PR that changes this also updates §2 (docs/DESIGN.md §3.1). Grid mode's
# own *seed addressing* (the base offset and the `base + cell*1_000 + i` formula) is WHI-1195's
# own scheme, not a segment, and is not declared here — only its axis levels and per-cell
# seed count are, since those are the "grid levels"/"sim counts" §3.1 puts in this file.
#
# Each segment's seeds are `start, start+stride, ..., start+(count-1)*stride`. Every pair of
# segments must be disjoint except where one declares `subset_of` the other — checked at
# load time, not just asserted here.

[segments.observation]
start = 0
count = 1000
# Never a decision input (docs/DESIGN.md §2.2): reporting only, so a leaderboard-comparable
# number is always visible without ever feeding a ranking choice.
decision_input = false

[segments.train]
start = 1000000
count = 1000
decision_input = true

[segments.screening]
start = 1000000
count = 200
subset_of = "train"
decision_input = true

[segments.validation]
start = 2000000
count = 1000
decision_input = true

[segments.test]
start = 3000000
count = 1000
single_use = true
decision_input = true

# Search protocol (docs/DESIGN.md §2.5, §3.1): the evaluation-point budget spent fitting a
# family's free parameters. Validated at load time to never exceed the protocol's own hard
# cap of 300 (tools/bench/src/search.rs::MAX_SEARCH_POINTS) — this section can lower the
# budget, never raise it past the cap.
[search]
max_points = 300

# Grid mode's factorial (docs/DESIGN.md §2.3): endpoints + a representative midpoint of each
# of `HyperparameterVariance::default()`'s own sampling ranges. 27 cells (the cartesian
# product of the three levels lists below) x seeds_per_cell.
[grid]
norm_fee_bps_levels = [30, 55, 80]
norm_liquidity_mult_levels = [0.4, 1.0, 2.0]
gbm_sigma_levels = [0.0001, 0.001, 0.007]
seeds_per_cell = 40

# `bench fuzz`'s own sample counts (WHI-1212, docs/DESIGN.md §2.9): how hard the pre-search
# shape gate hammers a candidate before a frozen search may spend budget on it.
# `dense_sweep_points`: points per dense sweep (linear/geometric/clustered grid shapes) run
# against each state, on each side. `seeds_per_regime`: GBM price-path seeds sampled per
# grid regime corner when locating that regime's drift extremes (very small / very large
# spot). `golden_price_multipliers`: relative-to-spot fair-price targets driving the
# golden-section-shaped sample sets (mirrors what `crates/sim/src/arbitrageur.rs`'s search
# actually produces, at several assumed mispricings).
[fuzz]
dense_sweep_points = 240
seeds_per_regime = 3
golden_price_multipliers = [0.1, 0.5, 0.9, 1.0, 1.1, 2.0, 10.0]
