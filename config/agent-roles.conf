# Agent role → dispatch mapping.
#
# Read by scripts/agent-dispatch.sh; explained in docs/agents/runtime.md.
# Shell-sourced, so: KEY="value", no spaces around `=`, no secrets (API keys stay
# in .env — this file is checked in).
#
# Four roles. Each needs a _CMD (how to reach it as a subprocess) and a _MODEL
# (which model it should run, for runtimes that dispatch natively instead).
#
#   IMPLEMENTER  the session reading this. Never dispatched — it is the caller.
#   REVIEWER     fresh context, >= implementer strength. Ideally a DIFFERENT vendor
#                than IMPLEMENTER: independent failure modes catch more than a
#                stronger model sharing the implementer's blind spots.
#   ESCALATOR    strongest reasoner available. Resolves findings the review loop
#                could not close. May equal REVIEWER.
#   EXPLORER     cheap and fast, read-only codebase sweeps. Parallelised heavily,
#                so cost matters more than depth here.
#
# _CMD must be a NON-INTERACTIVE invocation that takes a prompt on stdin and
# writes the result to stdout. Verify yours with `--help` before trusting it —
# these flags change between CLI releases. `scripts/agent-dispatch.sh --probe`
# checks that the binary resolves; it cannot check that the flags are right.

# --- This repo ---------------------------------------------------------------
# ACTIVE: Claude Code implements, a fresh `claude -p --model opus` reviews.
# Same-vendor, so weaker than the cross-vendor arrangement below — the reviewer
# shares the implementer's training-induced blind spots. It is active because it
# is the configuration that actually works here: verified with a real dispatch,
# not just `--probe`.
IMPLEMENTER_LABEL="claude-code:opus"

REVIEWER_CMD="claude -p --model opus"
REVIEWER_MODEL="opus"

ESCALATOR_CMD="claude -p --model opus"
ESCALATOR_MODEL="opus"

# Read-only sweeps: cheap and fast matters more than depth here, and nothing
# about the review gate depends on this role.
EXPLORER_CMD="claude -p --model sonnet"
EXPLORER_MODEL="sonnet"

# --- PREFERRED once Codex auth works: cross-vendor review --------------------
# Cross-vendor is the better arrangement, not a fallback: a blind spot in one
# vendor's model is not systematically a blind spot in the other's
# (docs/agents/runtime.md § Choosing a reviewer). Swap these in and re-verify.
#
#   REVIEWER_CMD="codex exec --model gpt-5.6-terra"     # ~/.codex review_model
#   REVIEWER_MODEL="gpt-5.6-terra"
#   ESCALATOR_CMD="codex exec --model gpt-5.6-sol"      # ~/.codex model
#   ESCALATOR_MODEL="gpt-5.6-sol"
#
# `codex exec` is Codex's non-interactive mode; with stdin piped and no prompt
# argument it reads the prompt from stdin, which is how agent-dispatch.sh feeds
# it, and `-m/--model` selects the model. Both flags verified against
# `codex exec --help` (codex-cli 0.147.0).
#
# Why it is not active: as of the template bootstrap, a real dispatch to either
# model returns
#   503 auth_unavailable: no auth available (providers=codex, model=...)
# from the local model proxy at 127.0.0.1:8317. The binary resolves, so
# `--probe` reports `ok` — this is exactly the gap the probe cannot see
# (docs/agents/runtime.md § Preflight). Re-test with:
#
#   printf 'Reply with exactly: DISPATCH-OK\n' > /tmp/p.txt
#   scripts/agent-dispatch.sh REVIEWER /tmp/p.txt
#
# Whichever pair is active: a role whose dispatch fails means the review loop
# did not run. That is a hard stop at `In Review`, never a licence to
# self-review (docs/agents/runtime.md § Degraded mode).
