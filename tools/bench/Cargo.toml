[package]
name = "prop-amm-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
prop-amm-shared = { workspace = true }
prop-amm-executor = { workspace = true }
prop-amm-sim = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
libloading = { workspace = true }
# Needed by telemetry.rs's own per-config loop (engine::run_simulation_native doesn't offer
# a batch hook to reset/read thread-locals at a known simulation boundary — docs/DESIGN.md
# §2.7 — so telemetry drives its own rayon pool instead of runner::run_batch_native's).
rayon = { workspace = true }
# Pinned here, not in [workspace.dependencies] — see AGENTS.md: every extra line in an
# upstream-owned Cargo.toml is renegotiated at the next upstream sync.
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
# Same versions crates/cli pins, so the fast path's duplicated safety/shim logic
# (docs/DESIGN.md §2.6) parses source text identically to the reference path.
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
# Pairs with `syn` to render a parsed `syn::Type` back to source text (tools/bench/src/params.rs).
quote = "1"
# A regular dependency (not dev-only): the fast path copies each built dylib to a fresh
# temp file before loading it, so reloading the same build-dir output path never races a
# still-mapped previous load (tools/bench/src/fast_compile.rs).
tempfile = "3"
